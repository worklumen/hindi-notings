<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hindi Notings - Google Docs Viewer</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --tab-active-border: #2563eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top navigation / header */
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      height: 56px;
      gap: 1.5rem;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      user-select: none;
    }

    .brand-icon {
      width: 24px;
      height: 24px;
      color: var(--primary);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .header-left {
      display: flex;
      align-items: center;
      height: 100%;
      gap: 1.5rem;
    }

    .tabs-container {
      display: flex;
      height: 100%;
      align-items: flex-end;
      gap: 0.5rem;
    }

    .tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0 1rem;
      height: 44px;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-muted);
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
    }

    .tab-btn:hover {
      color: var(--text-main);
      background-color: #f1f5f9;
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--tab-active-border);
      font-weight: 600;
      background-color: #eff6ff;
    }

    .actions-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .edit-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.9rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: #ffffff;
      background-color: var(--primary);
      text-decoration: none;
      border-radius: 6px;
      transition: background-color 0.15s ease-in-out, transform 0.05s ease-in-out;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    }

    .edit-btn:hover {
      background-color: var(--primary-hover);
    }

    .edit-btn:active {
      transform: translateY(1px);
    }

    .edit-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Viewer / iframe area */
    main {
      flex: 1;
      width: 100%;
      height: calc(100vh - 56px);
      position: relative;
      background-color: #f1f5f9;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .embed-note {
      position: absolute;
      bottom: 12px;
      right: 16px;
      background: rgba(15, 23, 42, 0.85);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      pointer-events: none;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <line x1="10" y1="9" x2="8" y2="9"></line>
        </svg>
        <span class="brand-title">Hindi Notings</span>
      </div>

      <nav class="tabs-container" role="tablist">
        <button 
          id="tab-klw" 
          class="tab-btn" 
          role="tab" 
          aria-selected="false" 
          onclick="switchTab('klw')"
        >
          KLW
        </button>
        <button 
          id="tab-tnpani" 
          class="tab-btn" 
          role="tab" 
          aria-selected="false" 
          onclick="switchTab('tnpani')"
        >
          TNPANI
        </button>
      </nav>
    </div>

    <div class="actions-container">
      <a id="edit-link" href="#" target="_blank" rel="noopener noreferrer" class="edit-btn">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
        </svg>
        <span>Edit in Google Docs</span>
      </a>
    </div>
  </header>

  <main>
    <iframe id="doc-frame" title="Google Doc Viewer" src="" allowfullscreen></iframe>
    <div class="embed-note">If document preview is restricted by Google login, click "Edit in Google Docs" above</div>
  </main>

  <script>
    const docs = {
      tnpani: {
        name: 'TNPANI',
        editUrl: 'https://docs.google.com/document/d/1VZh3o3LswSlk6KhI7TbhfPMR0Bq3bsh9habdDabNeFU/edit?usp=sharing',
        // preview URL embeds cleanly in iframe
        embedUrl: 'https://docs.google.com/document/d/1VZh3o3LswSlk6KhI7TbhfPMR0Bq3bsh9habdDabNeFU/preview'
      },
      klw: {
        name: 'KLW',
        editUrl: 'https://docs.google.com/document/d/1aAFHfyplD8suvcNWnrwyFgyXOv4D4U8g2Gxz_RSchlM/edit?tab=t.0',
        embedUrl: 'https://docs.google.com/document/d/1aAFHfyplD8suvcNWnrwyFgyXOv4D4U8g2Gxz_RSchlM/preview'
      }
    };

    const STORAGE_KEY = 'hindi_notings_selected_tab';

    function switchTab(tabKey) {
      if (!docs[tabKey]) {
        tabKey = 'tnpani';
      }

      // Update Tab styling and ARIA attributes
      Object.keys(docs).forEach(key => {
        const btn = document.getElementById(`tab-${key}`);
        if (btn) {
          const isActive = key === tabKey;
          btn.classList.toggle('active', isActive);
          btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
        }
      });

      // Update iframe & edit button
      const doc = docs[tabKey];
      const iframe = document.getElementById('doc-frame');
      const editLink = document.getElementById('edit-link');

      if (iframe.src !== doc.embedUrl) {
        iframe.src = doc.embedUrl;
      }
      editLink.href = doc.editUrl;
      editLink.title = `Open ${doc.name} in Google Docs`;

      // Save tab to localStorage
      try {
        localStorage.setItem(STORAGE_KEY, tabKey);
      } catch (e) {
        console.warn('Unable to persist tab selection to localStorage:', e);
      }
    }

    // Initialize tab from localStorage or default to 'klw'
    (function init() {
      let savedTab = 'klw';
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored && docs[stored]) {
          savedTab = stored;
        }
      } catch (e) {
        console.warn('Unable to read tab selection from localStorage:', e);
      }

      switchTab(savedTab);
    })();
  </script>
</body>
</html>
